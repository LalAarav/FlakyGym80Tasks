# performance.toml — model rollout statistics for one task.
# Lives at tasks/<instance_id>/performance.toml alongside task.toml.
# Generated from CI rollout results; not hand-edited.
#
# Conventions:
#   - One [[rollouts]] table per task: "hy4-preview" and "sol" (gpt-5.6-sol).
#   - rollout_n counts VALID rollouts only. System errors (provider 5xx, rate limits,
#     agent startup crashes) and confirmed reward-hacked runs are excluded and reported
#     in excluded_system_errors / excluded_reward_hacked.
#   - reward_mean is the mean of reward.json["reward"] over valid rollouts.
#   - pass_rate is a reference statistic (equals reward_mean for binary-reward tasks).
#   - median_assistant_turns is the median count of role=assistant messages over valid rollouts.
#   - Rollout directories: trajectory/<instance_id>/<role>/rollout_<harness>_<n>/
#     Hint-conditioned reruns (trajectory/<instance_id>/<role>/rollout_<harness>_hint_<n>/)
#     are never counted here.

